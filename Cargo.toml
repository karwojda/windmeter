[package]
edition = "2024"
name = "wind_meter"
version = "0.1.0"

[[bin]]
name = "wind_meter"
test = false
bench = false
required-features = ["embedded"]

[lib]
# enable test harness on host so `cargo test` uses the standard test harness
harness = true

# for each crate in the `tests` directory
[[test]]
name = "wind_meter" # tests/test-name.rs
harness = true

[dependencies]
# Make embedded-only dependencies optional so host `cargo test` can run with `--no-default-features`.
# The `embedded` feature enables the embedded stack; it remains the default for embedded builds.

# no_std, no external dependencies -- available on host and embedded alike,
# so GPS sentence parsing (Task 2) is host-testable against real captured
# sentences without the `embedded` feature.
nmea0183 = "0.6"

defmt = { version = "1.0", optional = true }
defmt-rtt = { version = "1.1", optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"], optional = true }

embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }
embedded-storage = { version = "0.3.1", optional = true }
cortex-m-rt = { version = "0.7.3", optional = true }

embassy-executor = { default-features=false, version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"], optional = true }
embassy-sync = { version = "0.7", optional = true }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"], optional = true }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"], optional = true }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h723zg", "time-driver-tim2", "exti", "memory-x", "unstable-pac", "chrono" ], optional = true }
embedded-test = { version = "0.7.1", features = ["embassy"], optional = true } # Enables async test support
embedded-sdmmc = { version = "0.10.0", default-features = false, features = ["defmt-log"], optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true }
libm = "0.2.16"

[features]
# Preserve previous embedded behaviour by making it the default feature.
default = ["embedded"]
embedded = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embedded-hal",
    "embedded-hal-async",
    "embedded-io",
    "embedded-io-async",
    "embedded-storage",
    "cortex-m-rt",
    "embassy-executor",
    "embassy-sync",
    "embassy-time",
    "cortex-m",
    "embassy-stm32",
    "embedded-test",
    "embedded-sdmmc",
    "embedded-hal-bus",
]

[dev-dependencies]

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
