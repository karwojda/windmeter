name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    # id-token: Codecov upload authenticates via OIDC, so no
    # CODECOV_TOKEN secret is needed. Declaring any permission drops the
    # rest to none, hence contents: read for checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: windmeter-ci:local
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore cargo registry cache
        uses: actions/cache@v5
        with:
          path: .ci-cargo-registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # SysML model validation, host tests, coverage (gated, see
      # ci/verify.sh), and the embedded (STM32H723ZG) build -- all in one
      # step so a failure's exact point is visible directly in this
      # step's log. Deliberately does NOT run cargo-mutants: a full-crate
      # mutation run takes tens of minutes, too expensive for every
      # push/PR. Run it locally instead (PROJECT_PRINCIPLES.md § Test
      # Quality).
      - name: Verify (sysml, tests, coverage, embedded build)
        run: |
          mkdir -p .ci-cargo-registry
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/workspace \
            -v "$PWD/.ci-cargo-registry":/usr/local/cargo/registry \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            windmeter-ci:local \
            ./ci/verify.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: ignore

      # Publishes ci/verify.sh's lcov.info for the README badge. Not a
      # gate: the coverage threshold is enforced by cargo llvm-cov
      # --fail-under-lines in ci/verify.sh, so a Codecov outage must not
      # fail the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          use_oidc: true
          fail_ci_if_error: false

      # Hardware-behavior regression checks against an emulated
      # STM32H723ZG (no physical board needed) -- see
      # PROJECT_PRINCIPLES.md § Booting the Firmware Under Emulation.
      # Needs the embedded build from the Verify step above; doesn't
      # rebuild it itself.
      - name: Renode tests (renode/tests/*.robot)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/workspace \
            -w /workspace \
            windmeter-ci:local \
            ./ci/renode-test.sh

      - name: Upload Renode test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renode-test-report
          path: |
            report.html
            log.html
          if-no-files-found: ignore
