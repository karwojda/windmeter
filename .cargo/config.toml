[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32H723ZG"


# Default build target removed to allow host testing with `cargo test`.
# To build for the embedded target (STM32H723ZG), set the target explicitly when building
# or restore the `build.target` setting below.
